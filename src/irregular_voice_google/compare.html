<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper vs. angepasst</title>
<style>
  :root { --bg: #f7f7f5; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e2e2dd;
          --ok: #1f7a4d; --err: #b3261e; --err-bg: #fbe9e7; --accent: #2b59c3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --fg: #ecece8; --muted: #9a9a93; --line: #33332f;
            --ok: #5cc28b; --err: #ff8a80; --err-bg: #3a1f1c; --accent: #8fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .totals { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; min-width: 180px; }
  .stat b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 14px; }
  .clip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .head .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
           border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .viz { position: relative; cursor: pointer; }
  canvas { display: block; width: 100%; border-radius: 6px; }
  canvas.wave { height: 70px; }
  canvas.spec { height: 150px; margin-top: 4px; background: #000; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); left: 0; display: none; }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td { padding: 6px 8px; vertical-align: top; border-top: 1px solid var(--line); }
  td:first-child { width: 110px; color: var(--muted); white-space: nowrap; }
  td.wer { width: 70px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .ref { font-weight: 600; }
  .bad { color: var(--err); background: var(--err-bg); border-radius: 4px; padding: 0 3px; }
  .ok { color: var(--ok); font-weight: 600; }
  @media (max-width: 600px) { td:first-child { width: 80px; } .stat { min-width: 0; flex: 1; } }
</style>
</head>
<body>
<main>
  <h1>Whisper vs. angepasst</h1>
  <p class="sub" id="sub"></p>
  <div class="totals" id="totals"></div>
  <div id="clips"></div>
</main>
<script>
const DATA = /*DATA*/null;

const ctx = new (window.AudioContext || window.webkitAudioContext)();
let playing = null;  // {src, start, offset, dur, head}

function b64ToBuf(b64) {
  const bin = atob(b64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

function fft(re, im) {  // in place, radix 2
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
      }
    }
  }
}

// inferno-like colour ramp
const STOPS = [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]];
function colour(v) {
  const x = Math.max(0, Math.min(1, v)) * (STOPS.length - 1), i = Math.floor(x), f = x - i;
  const a = STOPS[i], b = STOPS[Math.min(i + 1, STOPS.length - 1)];
  return [0, 1, 2].map(c => a[c] + (b[c] - a[c]) * f);
}

function sized(canvas) {
  const r = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * r);
  canvas.height = Math.round(canvas.clientHeight * r);
  return canvas.getContext("2d");
}

function drawWave(canvas, x) {
  const g = sized(canvas), w = canvas.width, h = canvas.height, per = x.length / w;
  g.fillStyle = getComputedStyle(document.body).getPropertyValue("--accent");
  for (let px = 0; px < w; px++) {
    let lo = 0, hi = 0;
    for (let i = Math.floor(px * per); i < Math.floor((px + 1) * per); i++) { lo = Math.min(lo, x[i]); hi = Math.max(hi, x[i]); }
    g.fillRect(px, h / 2 - hi * h / 2, 1, Math.max(1, (hi - lo) * h / 2));
  }
}

function drawSpec(canvas, x, rate) {
  const g = sized(canvas), w = canvas.width, h = canvas.height;
  const N = 512, hop = 128, frames = Math.max(1, Math.floor((x.length - N) / hop) + 1);
  const bins = Math.floor(N / 2 * Math.min(1, 8000 / (rate / 2)));  // 0-8 kHz
  const win = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
  const db = new Float32Array(frames * bins);
  let max = -Infinity;
  for (let f = 0; f < frames; f++) {
    const re = new Float32Array(N), im = new Float32Array(N);
    for (let i = 0; i < N; i++) re[i] = (x[f * hop + i] || 0) * win[i];
    fft(re, im);
    for (let k = 0; k < bins; k++) {
      const v = 10 * Math.log10(re[k] * re[k] + im[k] * im[k] + 1e-10);
      db[f * bins + k] = v; if (v > max) max = v;
    }
  }
  const img = g.createImageData(w, h), range = 70;
  for (let px = 0; px < w; px++) {
    const f = Math.min(frames - 1, Math.floor(px / w * frames));
    for (let py = 0; py < h; py++) {
      const k = Math.min(bins - 1, Math.floor((1 - py / h) * bins));
      const [r, gg, b] = colour((db[f * bins + k] - (max - range)) / range);
      const o = (py * w + px) * 4;
      img.data[o] = r; img.data[o + 1] = gg; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}

function stop() {
  if (!playing) return;
  playing.src.onended = null; playing.src.stop(); playing.head.style.display = "none"; playing.btn.textContent = "▶ Abspielen";
  playing = null;
}

function play(item, offset) {
  stop(); ctx.resume();
  const src = ctx.createBufferSource();
  src.buffer = item.buffer; src.connect(ctx.destination); src.start(0, offset);
  playing = { src, start: ctx.currentTime - offset, dur: item.buffer.duration, head: item.head, btn: item.btn };
  item.head.style.display = "block"; item.btn.textContent = "■ Stopp";
  src.onended = stop;
  (function tick() {
    if (!playing || playing.src !== src) return;
    item.head.style.left = (100 * (ctx.currentTime - playing.start) / playing.dur) + "%";
    requestAnimationFrame(tick);
  })();
}

function words(ws) {
  return ws.map(([w, ok]) => ok ? esc(w) : `<span class="bad">${esc(w)}</span>`).join(" ");
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function pct(x) { return Math.round(100 * x) + "%"; }
function pct1(x) { return (100 * x).toFixed(1).replace(".", ",") + " %"; }

document.getElementById("sub").textContent =
  `${DATA.clips.length} Test-Aufnahmen, die das angepasste Modell nie im Training gehört hat. Rot = falsches Wort.`;
document.getElementById("totals").innerHTML = DATA.models.map((m, i) =>
  `<div class="stat"><b>${pct1(DATA.wer[i])}</b><span>Wortfehler · ${esc(m)} (Zeichen ${pct1(DATA.cer[i])})</span></div>`).join("") +
  `<div class="stat"><b>${DATA.exact[1]}/${DATA.clips.length}</b><span>ganz richtig · ${esc(DATA.models[1])} (vorher ${DATA.exact[0]})</span></div>`;

const root = document.getElementById("clips");
DATA.clips.forEach((c, n) => {
  const el = document.createElement("section");
  el.className = "clip";
  el.innerHTML = `
    <div class="head"><button>▶ Abspielen</button><span class="n">${n + 1} / ${DATA.clips.length}</span></div>
    <div class="viz"><canvas class="wave"></canvas><canvas class="spec"></canvas><div class="playhead"></div></div>
    <div class="axis"><span>0 s</span><span>Spektrogramm 0–8 kHz</span><span class="dur"></span></div>
    <table>
      <tr><td>gesagt</td><td class="ref">${esc(c.ref)}</td><td class="wer"></td></tr>
      ${c.hyps.map((h, i) => `<tr><td>${esc(DATA.models[i])}</td><td>${words(h.words)}${h.exact ? ' <span class="ok">✓</span>' : ""}</td><td class="wer">${pct(h.wer)}</td></tr>`).join("")}
    </table>`;
  root.appendChild(el);
  const item = { btn: el.querySelector("button"), head: el.querySelector(".playhead") };
  ctx.decodeAudioData(b64ToBuf(c.wav)).then(buffer => {
    item.buffer = buffer;
    const x = buffer.getChannelData(0);
    drawWave(el.querySelector(".wave"), x);
    drawSpec(el.querySelector(".spec"), x, buffer.sampleRate);
    el.querySelector(".dur").textContent = buffer.duration.toFixed(1) + " s";
  });
  item.btn.onclick = () => (playing && playing.head === item.head) ? stop() : play(item, 0);
  el.querySelector(".viz").onclick = e => {
    if (!item.buffer) return;
    const r = e.currentTarget.getBoundingClientRect();
    play(item, (e.clientX - r.left) / r.width * item.buffer.duration);
  };
});
</script>
</body>
</html>
