[project]
name = "irregular-voice-google"
version = "0.1.0"
description = "Personalised German speech recognition for a speaker with dysarthria."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Ale" },
]
dependencies = [
  "jiwer>=3.0",
  "peft>=0.13",
  "torch>=2.4",
  "transformers>=4.45",
]

[project.scripts]
ivg-manifest = "irregular_voice_google.manifest:main"
ivg-eval = "irregular_voice_google.evaluate:main"
ivg-record = "irregular_voice_google.recorder:main"
ivg-import-samples = "irregular_voice_google.import_samples:main"
ivg-train = "irregular_voice_google.train:main"
ivg-preprocess = "irregular_voice_google.preprocess:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
